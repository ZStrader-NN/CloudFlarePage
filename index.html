<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Processed</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f7fb;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 520px);
      padding: 48px 40px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(23, 32, 51, .12);
    }
    .checkmark {
      width: 68px;
      height: 68px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e8f8ef;
      color: #168244;
      font-size: 38px;
      font-weight: 700;
    }
    h1 { margin: 0 0 14px; font-size: clamp(1.75rem, 4vw, 2.3rem); }
    p { margin: 0; color: #526075; font-size: 1.05rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="checkmark" aria-hidden="true">✓</div>
    <h1>Request Processed</h1>
    <p>Your request has been received and processed successfully.</p>
  </main>
</body>
</html>
